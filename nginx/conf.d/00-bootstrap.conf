# =============================================================================
# Stage 1 — HTTP only. This is the config the stack starts with.
#
# Two jobs:
#   1. Serve the ACME http-01 challenge so certbot can issue the first
#      certificate. nginx must already be running and reachable on :80 for that,
#      which is the whole reason TLS cannot be in the initial config: nginx
#      refuses to start when ssl_certificate points at a file that does not
#      exist yet.
#   2. Proxy the app, so the stack can be smoke-tested over http:// before
#      anyone touches DNS validation or certificates.
#
# Once 10-tls.conf is enabled (see DEPLOY.md), the `location /` block below is
# replaced by a redirect to https:// — edit this file at that point and keep
# only the acme-challenge location plus the redirect.
#
# DOMAIN: new.skatisho.com on DigitalOcean. On the Iran/Arvan VPS this becomes
# skatisho.com — change server_name here AND in 10-tls.conf, then reissue the
# certificate. No application rebuild is involved: the image carries no domain.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name new.skatisho.com;

    # --- ACME http-01 challenge -------------------------------------------
    # Must stay reachable over plain HTTP forever, including after TLS is on,
    # or automatic renewal fails 60 days later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Pre-TLS smoke testing ---------------------------------------------
    # AFTER issuing the certificate, replace this entire block with:
    #     location / { return 301 https://$host$request_uri; }
    location / {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Matched to the TLS config so an upload tested here behaves the same
        # way it will in production.
        client_max_body_size 600m;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Upload routes need request buffering off even during smoke testing —
    # see the long explanation in 10-tls.conf.
    location ~ ^/(api/upload|api/auth/avatar) {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
