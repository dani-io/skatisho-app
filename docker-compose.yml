# =============================================================================
# Skatisho — production stack (Coolify or any `docker compose` host)
#
# Contains: app (Next.js standalone) + minio (private object storage) +
#           a one-shot bucket bootstrap.
#
# NOT here (by design):
#   - PostgreSQL  -> provisioned separately (Coolify New Resource) so it gets
#                    managed backups and is never wiped by `compose down -v`.
#
# Security posture:
#   - MinIO publishes NO ports to the host. Only `app` reaches it, over the
#     internal Docker network at http://minio:9000.
#   - The browser never touches MinIO: private objects stream through the app's
#     authenticated routes; public objects are fronted by cdn.skatisho.com.
#
# All values come from the environment — see .env.example.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # app — Next.js (built from the Dockerfile in this repo)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time.
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # --- Core ---
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      # `:?` makes compose refuse to start when unset, rather than substituting
      # a shared default that would sign real sessions.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}

      # --- Storage (must match src/lib/s3.ts exactly) ---
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      - S3_BUCKET_PRIVATE=${S3_BUCKET_PRIVATE}
      - S3_BUCKET_PUBLIC=${S3_BUCKET_PUBLIC}
      - NEXT_PUBLIC_CDN_URL=${NEXT_PUBLIC_CDN_URL}

      # --- SMS (provider-agnostic layer) ---
      - SMS_PROVIDER=${SMS_PROVIDER}
      - SMS_SELFHOSTED_URL=${SMS_SELFHOSTED_URL}
      - SMS_SELFHOSTED_KEY=${SMS_SELFHOSTED_KEY}
      - SMS_KAVENEGAR_KEY=${SMS_KAVENEGAR_KEY}

      # --- Payment (Zarinpal) ---
      - ZARINPAL_MERCHANT=${ZARINPAL_MERCHANT}
      - ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX}

      # --- Push notifications (VAPID) ---
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
    depends_on:
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Cap so a traffic spike can't starve other services on the host.
          memory: 2g

  # ---------------------------------------------------------------------------
  # minio — private object storage, internal network only (NO published ports)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOTE: intentionally no `ports:` — MinIO must not be reachable from the
    # host or the internet. `app` talks to it over the internal network only.

  # ---------------------------------------------------------------------------
  # createbuckets — one-shot: create the two buckets with correct policies,
  # then exit. Makes the stack self-provisioning on any fresh host.
  # ---------------------------------------------------------------------------
  createbuckets:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
      mc mb --ignore-existing local/$${S3_BUCKET_PRIVATE};
      mc mb --ignore-existing local/$${S3_BUCKET_PUBLIC};
      mc anonymous set none     local/$${S3_BUCKET_PRIVATE};
      mc anonymous set download local/$${S3_BUCKET_PUBLIC};
      echo 'Buckets ready: private=none, public=download';
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}

volumes:
  minio_data:
